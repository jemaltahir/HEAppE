apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unseal
  labels:
    app: vault
    component: unseal
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault-mvp-sa
      restartPolicy: OnFailure

      initContainers:
      - name: wait-for-vault-svc-for-unseal
        image: alpine/curl:latest
        command: ['sh', '-c']
        args:
          - |
            set -ex
            echo '[Unseal InitContainer] Waiting for Vault service...'
            ATTEMPTS=0
            MAX_ATTEMPTS=12
            HEALTH_URL="http://vault-service:8200/v1/sys/health"
            until curl --connect-timeout 3 -s -o /dev/null "$HEALTH_URL"; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                echo '[Unseal InitContainer] Max attempts reached. Vault not responding.'
                curl -i -v "$HEALTH_URL"
                exit 1
              fi
              echo "[Unseal InitContainer] Vault not ready yet (attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
              sleep 5
            done
            echo '[Unseal InitContainer] Vault is responsive.'

      containers:
      - name: vault-unsealer
        image: image-registry.openshift-image-registry.svc:5000/heappe-dev/vault-with-tools:1.17.3
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "[vault-unseal] Unsealer script starting..."
            VAULT_ADDR_FOR_SCRIPT="http://vault-service:8200"

            if [ -z "$UNSEAL_KEY_1_FROM_ENV" ]; then
              echo "[vault-unseal] Error: UNSEAL_KEY_1_FROM_ENV is not set."
              exit 1
            fi

            echo "[vault-unseal] Checking current seal status..."
            SEAL_STATUS_JSON=$(vault status -address="$VAULT_ADDR_FOR_SCRIPT" -format=json || echo '{"sealed": true}')
            SEALED=$(echo "$SEAL_STATUS_JSON" | jq -r .sealed)

            if [ "$SEALED" = "false" ]; then
              echo "[vault-unseal] Vault is already unsealed."
              exit 0
            fi

            echo "[vault-unseal] Attempting to unseal Vault..."
            vault operator unseal -address="$VAULT_ADDR_FOR_SCRIPT" "$UNSEAL_KEY_1_FROM_ENV"

            sleep 2
            echo "[vault-unseal] Re-checking seal status..."
            NEW_SEAL_STATUS_JSON=$(vault status -address="$VAULT_ADDR_FOR_SCRIPT" -format=json || echo '{"sealed": true}')
            NEW_SEALED=$(echo "$NEW_SEAL_STATUS_JSON" | jq -r .sealed)

            if [ "$NEW_SEALED" = "false" ]; then
              echo "[vault-unseal] Vault successfully unsealed."
              exit 0
            else
              echo "[vault-unseal] Failed to unseal Vault. Current status:"
              echo "$NEW_SEAL_STATUS_JSON"
              exit 1
            fi
        env:
        - name: UNSEAL_KEY_1_FROM_ENV
          valueFrom:
            secretKeyRef:
              name: vault-keys
              key: unseal_key_1
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

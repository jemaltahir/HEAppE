apiVersion: v1
kind: Pod
metadata:
  name: pvc-write-test
spec:
  serviceAccountName: vault-mvp-sa # Use the same SA
  securityContext:
    runAsNonRoot: true
    # No fsGroup here, let OpenShift handle it
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: test-container
    image: alpine/git # A small image with sh
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -ex
        echo "Attempting to write to /mnt/data/test.txt"
        date > /mnt/data/test.txt
        echo "Write successful. Content of /mnt/data:"
        ls -l /mnt/data
        echo "Content of test.txt:"
        cat /mnt/data/test.txt
        echo "Sleeping..."
        sleep 3600 # Keep pod running
    volumeMounts:
    - name: mydata
      mountPath: /mnt/data
  volumes:
  - name: mydata
    persistentVolumeClaim:
      claimName: vault-server-data # Crucial: use the SAME PVC
  restartPolicy: Never
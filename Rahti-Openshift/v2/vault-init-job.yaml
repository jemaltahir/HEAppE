apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  labels:
    app: vault
    component: init
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: vault
        component: init
        job-name: vault-init
    spec:
      serviceAccountName: vault-mvp-sa
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-vault-svc
        image: alpine/curl:latest
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -ex
            echo '[initContainer] Waiting for Vault service at http://vault-service:8200/v1/sys/health ...'
            ATTEMPTS=0
            MAX_ATTEMPTS=30
            HEALTH_URL="http://vault-service:8200/v1/sys/health"
            until curl --connect-timeout 3 -sf -o /dev/null -w "%{http_code}" "$HEALTH_URL" | grep -qE "200|429|501|503"; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                echo "[initContainer] Max attempts reached. Vault service at $HEALTH_URL not responding."
                curl -v "$HEALTH_URL"
                exit 1
              fi
              echo "[initContainer] Vault service not ready yet (attempt $ATTEMPTS/$MAX_ATTEMPTS), sleeping 5s..."
              sleep 5
            done
            echo "[initContainer] Vault service is responsive."

      containers:
      - name: vault-initializer
        image: "image-registry.openshift-image-registry.svc:5000/heappe-dev/vault-with-tools:1.17.3"
        command: ["/config-script/init-vault.sh"]
        env:
        - name: VAULT_SKIP_VERIFY
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: init-script-volume
          mountPath: /config-script
          readOnly: true
        - name: job-pod-temporary-storage
          mountPath: /tmp

      volumes:
      - name: init-script-volume
        configMap:
          name: vault-init-script
          defaultMode: 0755
      - name: job-pod-temporary-storage
        emptyDir: {}

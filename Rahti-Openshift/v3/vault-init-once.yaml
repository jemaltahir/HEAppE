apiVersion: v1
kind: Pod
metadata:
  name: vault-init-once
spec:
  restartPolicy: Never
  containers:
  - name: init
    image: image-registry.openshift-image-registry.svc:5000/test-heappe-app/vault-helper:latest
    command: ["/bin/sh","-c"]
    args:
      - |
        set -e
        echo "[temp] starting Vault ..."
        vault server -config=/vault/config/vault.hcl >/dev/null 2>&1 &
        sleep 5

        # --- fix: make VAULT_ADDR visible to the CLI ---
        export VAULT_ADDR=http://127.0.0.1:8200

        echo "[temp] running operator init ..."
        vault operator init -key-shares=1 -key-threshold=1 -format=json > /vault/data/init.json
        cat /vault/data/init.json
        echo "[temp] keys printed above — copy them, then delete this pod."
        sleep 300
    volumeMounts:
      - { name: data, mountPath: /vault/data }
      - { name: cfg,  mountPath: /vault/config }
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: vault-data-pvc }
    - name: cfg
      configMap: { name: vault-config-cm }

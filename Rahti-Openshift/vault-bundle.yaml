apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  selector:
    app: vault
  ports:
  - name: http
    port: 8200
    targetPort: 8200
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vault-agent-service
spec:
  selector:
    app: vault-agent
  ports:
  - name: http
    port: 8100
    targetPort: 8100
    protocol: TCP
  type: ClusterIP

# ---
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: vault-data
# spec:
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-agent-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  labels:
    app: vault
  annotations:
    description: Basic Vault server config
    created-by: vault-admin
    managed-by: user
    purpose: vault
data:
  vault.hcl: |
    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    disable_mlock = true
    ui = true

    api_addr = "http://0.0.0.0:8200"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config
  labels:
    app: vault-agent
  annotations:
    description: Vault Agent config
    created-by: vault-admin
    managed-by: user
    purpose: agent
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent/pidfile"

    listener "tcp" {
      address     = "127.0.0.1:8100"
      tls_disable = true
    }

    auto_auth {
      method "approle" {
        mount_path = "auth/approle"
        config = {
          role_id_file_path = "/vault/agent/role_id"
          secret_id_file_path = "/vault/agent/secret_id"
        }
      }

      sink "file" {
        config = {
          path = "/vault/agent/token"
        }
      }
    }

    vault {
      address = "http://vault-service:8200"
    }

    cache {
      use_auto_auth_token = true
    }

    template {
      source      = "/vault/config/templates/dummy.tpl"
      destination = "/vault/agent/rendered/dummy.txt"
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-templates
  labels:
    app: vault-agent
  annotations:
    description: Placeholder for vault agent template rendering
    created-by: vault-admin
    managed-by: user
    purpose: template
data:
  dummy.tpl: |
    {{ with secret "secret/data/dummy" }}
    Dummy key: {{ .Data.data.key }}
    {{ end }}

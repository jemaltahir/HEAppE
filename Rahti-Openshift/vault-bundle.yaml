---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault          
      containers:
      - name: vault
        image: "image-registry.openshift-image-registry.svc:5000/test-heappe-app/hashicorp-vault:1.17.3"
        command: ["vault"]
        args: ["server", "-config=/vault/config/vault.hcl", "-log-level=debug"]
        ports:
        - containerPort: 8200
        env:
        - name: VAULT_ADDR
          value: "http://localhost:8200"
        - name: VAULT_API_ADDR
          value: "http://localhost:8200"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "[vault-init] Waiting for Vault to become ready..."
                until wget -q --spider http://localhost:8200/v1/sys/health; do
                  echo "[vault-init] Vault not yet reachable, waiting..."
                  sleep 2
                done
                echo "[vault-init] Vault is reachable."

                if vault status | grep -q 'Initialized.*true'; then
                  echo "[vault-init] Already initialized."
                  exit 0
                fi

                echo "[vault-init] Initializing Vault..."
                vault operator init -format=json > /vault/data/init.json
                UNSEAL_KEY=$(jq -r '.unseal_keys_b64[0]' /vault/data/init.json)
                ROOT_TOKEN=$(jq -r '.root_token' /vault/data/init.json)
                vault operator unseal $UNSEAL_KEY
                vault login $ROOT_TOKEN
                vault secrets enable -version=2 kv
        volumeMounts:
        - name: vault-data
          mountPath: /vault/data
        - name: vault-config
          mountPath: /vault/config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            port: 8200
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: vault-data
        emptyDir: {}
      - name: vault-config
        configMap:
          name: vault-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-agent
  template:
    metadata:
      labels:
        app: vault-agent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vault-agent
        image: "image-registry.openshift-image-registry.svc:5000/test-heappe-app/hashicorp-vault:1.17.3"
        command: ["vault"]
        args: ["agent", "-config=/vault/config/vault-agent.hcl", "-log-level=debug"]
        ports:
        - containerPort: 8100
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: vault-agent-data
          mountPath: /vault/agent
        - name: vault-agent-config
          mountPath: /vault/config
        - name: vault-logs
          mountPath: /vault/logs
        - name: vault-templates
          mountPath: /vault/config/templates
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: vault-agent-data
        persistentVolumeClaim:
          claimName: vault-agent-data
      - name: vault-agent-config
        configMap:
          name: vault-agent-config
      - name: vault-logs
        persistentVolumeClaim:
          claimName: vault-logs
      - name: vault-templates
        configMap:
          name: vault-templates
